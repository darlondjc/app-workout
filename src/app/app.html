<div class="progresso" [class.progresso--ativo]="loading.ativo()" role="progressbar" aria-label="Carregando" [attr.aria-hidden]="!loading.ativo()"></div>

<div class="quadro" [class.com-abas]="mostrarAbas()">
  <main>
    <router-outlet />
  </main>

  @if (mostrarAbas()) {
    <nav class="abas" aria-label="Navegação principal">
      <a routerLink="/" routerLinkActive="ativa" [routerLinkActiveOptions]="{ exact: true }">
        <app-icon name="home" /> Início
      </a>
      <a routerLink="/biblioteca" routerLinkActive="ativa">
        <app-icon name="search" /> Biblioteca
      </a>
      <a routerLink="/fichas" routerLinkActive="ativa">
        <app-icon name="clipboard" /> Fichas
      </a>
      <a routerLink="/social" routerLinkActive="ativa" [attr.aria-label]="social.novidades() > 0 ? 'Social, ' + social.novidades() + (social.novidades() === 1 ? ' novidade' : ' novidades') : null">
        <span class="aba-icone">
          <app-icon name="people" />
          @if (social.novidades() > 0) {
            <span class="aba-aviso" aria-hidden="true">{{ social.novidades() > 9 ? '9+' : social.novidades() }}</span>
          }
        </span>
        Social
      </a>
      <a routerLink="/ajustes" routerLinkActive="ativa">
        @if (nuvem.usuario(); as u) {
          <app-avatar [usuario]="u" [tamanho]="24" />
        } @else {
          <app-icon name="settings" />
        }
        Ajustes
      </a>
    </nav>
  }

  @if (update.mostrarBotao() && mostrarAviso()) {
    <div class="atualizacao" role="status">
      <button type="button" class="atualizacao__botao" (click)="update.atualizar()">
        <app-icon name="refresh" [size]="18" [stroke]="2.4" /> Atualizar
      </button>
      <button type="button" class="atualizacao__fechar" aria-label="Agora não. Atualize depois em Ajustes" (click)="update.dispensar()">
        <app-icon name="close" [size]="16" [stroke]="2.4" />
      </button>
    </div>
  }

  @if (toast.mensagem(); as texto) {
    <div class="aviso" role="status">{{ texto }}</div>
  }
</div>
