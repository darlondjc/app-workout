  <!-- Aplica o tema escolhido antes de o app carregar, para a tela não piscar em claro. Mantém em sincronia com core/tema.service.ts. -->
  <script>
    (function () {
      try {
        var p = localStorage.getItem('app-workout:tema:v1');
        var escuro = p === 'escuro' || ((p !== 'claro') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-tema', escuro ? 'escuro' : 'claro');
        if (escuro) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#121517');
      } catch (e) {}
    })();
  </script>

  <style>
    /* Abertura exibida enquanto o app carrega; some com um fade quando o Angular inicia. */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: radial-gradient(120% 80% at 50% 38%, #222a2f, #14171a 70%);
      color: #fff;
      font: 700 24px/1 system-ui, -apple-system, 'Segoe UI', sans-serif;
      letter-spacing: -0.02em;
      transition: opacity 0.35s ease;
    }
    #splash.saindo { opacity: 0; pointer-events: none; }
    #splash svg { width: 168px; height: 168px; animation: respirar 1.8s ease-in-out infinite; }
    #splash b { color: #cdeb3b; }
    @keyframes respirar { 50% { transform: scale(1.06) rotate(-3deg); } }
    @media (prefers-reduced-motion: reduce) {
      #splash svg { animation: none; }
      #splash { transition: none; }
    }
  </style>
</head>
